<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path Prospect Map</title>
<meta name="description" content="A national map of US plants that could use Path Robotics' autonomous welding, by vertical and supply-chain tier. Every value traces to a quoted source.">
<meta name="color-scheme" content="light dark">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --bg:#f4f6f8; --surface:#fff; --surface2:#eef1f5; --text:#17202a; --muted:#566273; --border:#d9dfe6;
  --accent:#1d4ed8; --accent-ink:#fff; --focus:#1d4ed8;
  --high:#0b8a5c; --med:#c76a00; --low:#5f6f86; --np:#8b96a6;
  --high-bg:#dcf4ea; --med-bg:#fdecd2; --low-bg:#e5e9f0; --np-bg:#eef0f3;
  --inf:#6d28d9; --inf-bg:#ede7fb; --ok:#0b7a4b; --ok-bg:#dcf4ea; --warn:#a15c00; --warn-bg:#fdecd2; --bad:#b42318; --bad-bg:#fde3df;
  --land:#e3e8ee; --land-has:#c9d6ea; --land-sel:#9db7e8; --stroke:#fff;
  --t-oem:#2563eb; --t-t1:#0d9488; --t-t2:#9333ea; --t-cf:#db2777; --t-t3:#78716c; --t-unk:#8b96a6;
  --sup:#c2410c; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --surface:#161c24; --surface2:#1d2530; --text:#e7ebf1; --muted:#9ba8b8; --border:#2b3542;
    --accent:#7ba3ff; --accent-ink:#0b1220; --focus:#9dbaff;
    --high:#3ccf97; --med:#f2a73b; --low:#93a3bb; --np:#7d8998;
    --high-bg:#12382b; --med-bg:#3b2a10; --low-bg:#232d3a; --np-bg:#1d2530;
    --inf:#c4adff; --inf-bg:#2a2146; --ok:#58d79f; --ok-bg:#12382b; --warn:#f2a73b; --warn-bg:#3b2a10; --bad:#ff8f84; --bad-bg:#431a16;
    --land:#232c38; --land-has:#2f4468; --land-sel:#3f5f97; --stroke:#0e1319;
    --t-oem:#6ea0ff; --t-t1:#3dd6c6; --t-t2:#c28bff; --t-cf:#ff7ab8; --t-t3:#b0a8a1; --t-unk:#7d8998;
    --sup:#ff9a57; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161c24; --surface2:#1d2530; --text:#e7ebf1; --muted:#9ba8b8; --border:#2b3542;
  --accent:#7ba3ff; --accent-ink:#0b1220; --focus:#9dbaff;
  --high:#3ccf97; --med:#f2a73b; --low:#93a3bb; --np:#7d8998;
  --high-bg:#12382b; --med-bg:#3b2a10; --low-bg:#232d3a; --np-bg:#1d2530;
  --inf:#c4adff; --inf-bg:#2a2146; --ok:#58d79f; --ok-bg:#12382b; --warn:#f2a73b; --warn-bg:#3b2a10; --bad:#ff8f84; --bad-bg:#431a16;
  --land:#232c38; --land-has:#2f4468; --land-sel:#3f5f97; --stroke:#0e1319;
  --t-oem:#6ea0ff; --t-t1:#3dd6c6; --t-t2:#c28bff; --t-cf:#ff7ab8; --t-t3:#b0a8a1; --t-unk:#7d8998;
  --sup:#ff9a57; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{line-height:1.2;margin:0}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:6px;z-index:100}
.skip:focus{top:8px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--border)}
.top-row{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;padding:14px 0}
.brand h1{font-size:22px;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px 14px;min-width:110px}
.stat b{display:block;font-size:22px;line-height:1.15}
.stat span{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 0 12px}
.search{flex:1 1 220px;min-width:0;max-width:380px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);}
.chk{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;user-select:none;font-size:14px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.btn{padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 9px;font-size:13px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;border-top:1px solid var(--border);margin:0 -16px;padding:0 16px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600;font-size:14px}
nav.tabs button[aria-current="page"]{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--text)}

main{padding:24px 0 40px;min-height:60vh}
.view-h{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-bottom:10px}
.view-h h2{font-size:20px}
.view-h p{margin:0;color:var(--muted);font-size:14px;flex:1 1 320px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* filters */
.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.filters select{padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);min-width:0;width:100%}
.filters .count{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* badges */
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:999px;vertical-align:1px;white-space:nowrap;border:1px solid transparent}
.b-inf{color:var(--inf);background:var(--inf-bg);border:1px dashed var(--inf);text-transform:uppercase;font-size:10px}
.b-stated{color:var(--ok);background:var(--ok-bg)}
.b-unknown{color:var(--muted);background:var(--surface2);border:1px solid var(--border)}
.b-high{color:var(--high);background:var(--high-bg)} .b-medium{color:var(--med);background:var(--med-bg)} .b-low{color:var(--low);background:var(--low-bg)} .b-np{color:var(--muted);background:var(--np-bg);border:1px dashed var(--np)}
.b-ok{color:var(--ok);background:var(--ok-bg)} .b-warn{color:var(--warn);background:var(--warn-bg)} .b-bad{color:var(--bad);background:var(--bad-bg)} .b-grey{color:var(--muted);background:var(--surface2);border:1px solid var(--border)}
.b-st{color:var(--accent);background:var(--surface2);border:1px solid var(--border)}
.noev{font-size:10px;color:var(--muted);border:1px dotted var(--muted);border-radius:4px;padding:0 4px;white-space:nowrap;vertical-align:1px}
.hid{font-size:12px;color:var(--muted);font-style:italic}
button.val{all:unset;cursor:pointer;color:inherit;border-bottom:1px dotted var(--muted);border-radius:2px}
button.val:hover{background:var(--surface2);border-bottom-color:var(--accent)}
button.val:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
button.val.unk{color:var(--muted);font-style:italic}
button.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
button.link:hover{text-decoration:underline}
button.link:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.dot-i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid transparent}
.d-high{background:var(--high)} .d-medium{background:var(--med)} .d-low{background:var(--low)} .d-np{background:transparent;border-color:var(--np)}

/* ranking */
.vcards{display:grid;gap:12px}
.vcard{padding:14px 16px}
.vcard.rej{opacity:.82}
.vhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.vrank{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center;font-weight:800}
.vhead h3{font-size:17px;flex:1 1 220px}
.vmeta{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;align-items:center}
.vnum b{font-size:20px;display:block;line-height:1.1}.vnum span{font-size:12px;color:var(--muted)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2);border:1px solid var(--border);flex:1 1 220px;min-width:160px}
.bar i{display:block;height:100%}
.bar .s-high{background:var(--high)}.bar .s-medium{background:var(--med)}.bar .s-low{background:var(--low)}.bar .s-np{background:repeating-linear-gradient(45deg,var(--np-bg),var(--np-bg) 4px,var(--border) 4px,var(--border) 6px)}
.score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 18px;margin:12px 0 0}
.score-grid div.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.score-grid div.v{font-size:14px}
.reason{margin:12px 0 0;color:var(--muted);font-size:13.5px}
details.more{margin-top:10px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px}
details.more p{margin:8px 0 0;font-size:13.5px}

/* map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:14px;align-items:start}
.mapbox{position:relative;padding:8px}
.mapbox svg{display:block;width:100%;height:auto;touch-action:pan-y pinch-zoom}
.st{fill:var(--land);stroke:var(--stroke);stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer}
.st.has{fill:var(--land-has)} .st.sel{fill:var(--land-sel)}
.st:hover{filter:brightness(.94)}
.pt{cursor:pointer;stroke:var(--surface);stroke-width:1.2;vector-effect:non-scaling-stroke}
.pt.c-high{fill:var(--high)} .pt.c-medium{fill:var(--med)} .pt.c-low{fill:var(--low)}
.pt.c-np{fill:var(--surface);stroke:var(--np);stroke-width:2}
.pt.c-oem{fill:var(--t-oem)} .pt.c-t1{fill:var(--t-t1)} .pt.c-t2{fill:var(--t-t2)} .pt.c-cf{fill:var(--t-cf)} .pt.c-t3{fill:var(--t-t3)} .pt.c-unk{fill:var(--t-unk)}
.pt.dim{opacity:.35}
.pt.sup{stroke:var(--sup);stroke-width:3}
.pt.excl{fill:var(--surface);stroke:var(--np);stroke-dasharray:3 2;stroke-width:2}
.pt:hover,.pt:focus{stroke:var(--text);stroke-width:2.5;outline:none}
.pt:focus-visible{stroke:var(--focus);stroke-width:3.5}
.lk{stroke:var(--sup);stroke-width:2;fill:none;vector-effect:non-scaling-stroke;stroke-dasharray:5 3}
.mapctl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:32px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);padding:6px 8px 2px;align-items:center}
.legend span.i{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:14px;height:14px}
.note{font-size:12.5px;color:var(--muted);padding:2px 8px 6px}
.list{max-height:640px;overflow:auto}
.list h3{font-size:15px;padding:12px 14px 6px;position:sticky;top:0;background:var(--surface);z-index:1}
.prow{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--border)}
.prow .nm{flex:1;min-width:0}
.prow .nm .sub{font-size:12.5px;color:var(--muted)}
.prow .sc{font-weight:800;min-width:34px;text-align:right}
.empty{padding:18px;color:var(--muted)}

/* call list */
.calls{overflow:hidden}
.crow{display:grid;grid-template-columns:32px minmax(170px,1.3fr) 104px 48px 70px 44px 84px 80px minmax(120px,1.2fr) minmax(180px,2.2fr);gap:4px 12px;padding:9px 14px;border-top:1px solid var(--border);align-items:start;font-size:13.5px}
.crow.hd{border-top:0;background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;position:sticky;top:0;z-index:2}
.crow .rk{color:var(--muted);font-weight:700}
.crow .nm{font-weight:700}
.crow .nm .sub{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.crow .unkc,.crow .ceil{font-size:13px}.crow .ceil{font-weight:700}.crow.hd .calc{display:block;text-transform:none;letter-spacing:0;font-weight:500;font-size:10px}
.b-pre{color:var(--accent);background:var(--surface2);border:1px dashed var(--accent)}
.unkn{font-size:12px;color:var(--muted);font-style:italic}
.crow .scr{font-weight:800;font-size:16px}
.crow .ol{color:var(--text);font-size:13px}
.live{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 7px;margin-bottom:3px}
.sortsel{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.sortsel select{padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}

/* supply */
.sc-top{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.sc-top label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px;flex:1 1 260px;max-width:520px;min-width:0}
.sc-top select{width:100%;min-width:0;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.lcard{padding:10px 14px;border-top:1px solid var(--border);font-size:14px}
.lcard .arrow{color:var(--sup);font-weight:700}
.tiergrp h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 14px 2px}

/* method */
.prose{max-width:900px}
.prose h3{font-size:18px;margin:26px 0 8px}
.prose h4{font-size:15px;margin:16px 0 6px}
.prose p,.prose li{font-size:14.5px}
.prose ul{padding-left:20px}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tscroll{overflow-x:auto}
code{background:var(--surface2);border-radius:4px;padding:0 4px;font-size:.92em}
.logbox{max-height:520px;overflow:auto;padding:4px 16px 12px}

/* dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--text);box-shadow:-8px 0 40px rgba(0,0,0,.28);margin:0 0 0 auto;max-width:640px;width:100%;height:100dvh;max-height:100dvh;overflow:auto}
dialog#drawer{max-width:520px}
dialog::backdrop{background:rgba(10,16,24,.45)}
.dlg-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:3}
.dlg-h h2{font-size:18px;flex:1;min-width:0}
.dlg-b{padding:14px 16px 28px}
.sec{margin-top:18px}
.sec>h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:4px}
dl.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.banner{padding:10px 12px;border-radius:10px;background:var(--np-bg);border:1px dashed var(--np);font-size:14px;margin-top:12px}
.banner.ex{background:var(--bad-bg);border:1px solid var(--bad)}
.bigscore{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bigscore .n{font-size:40px;font-weight:800;line-height:1}
.comp{padding:8px 0;border-top:1px solid var(--border)}
.comp:first-of-type{border-top:0}
.comp .row{display:flex;gap:10px;align-items:center}
.comp .row .lbl{flex:1;font-weight:600;font-size:14px}
.comp .meter{height:6px;border-radius:3px;background:var(--surface2);margin-top:5px;overflow:hidden}
.comp .meter i{display:block;height:100%;background:var(--accent)}
.comp .why{font-size:12.5px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{all:unset;cursor:pointer;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--accent);font-weight:600}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:3px solid var(--focus)}
.opening{font-size:15.5px;line-height:1.5;padding:12px 14px;border-left:4px solid var(--accent);background:var(--surface2);border-radius:0 10px 10px 0}
.evrow{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px}
.evrow.sel{border-color:var(--accent)}
blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--border);background:var(--surface2);border-radius:0 8px 8px 0;font-size:14px;overflow-wrap:anywhere}
.evrow dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;margin:6px 0 0;font-size:13px}
.evrow dt{color:var(--muted)} .evrow dd{margin:0;overflow-wrap:anywhere}

footer{border-top:1px solid var(--border);background:var(--surface);padding:16px 0 28px;font-size:13px;color:var(--muted)}
footer strong{color:var(--text)}

@media (max-width:900px){
  .mapgrid{grid-template-columns:1fr}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .list{max-height:none}
}
@media (max-width:760px){
  .crow{grid-template-columns:30px minmax(0,1fr) 50px 50px;grid-template-areas:"rk nm scr tier" ". rel rel rel" ". unk ceil ceil" ". trg trg trg" ". ol ol ol"}
  .crow.hd{display:none}
  .crow>.rk{grid-area:rk}.crow>.nm{grid-area:nm}.crow>.scr{grid-area:scr}.crow>.tr{grid-area:tier}
  .crow>.unkc{grid-area:unk}.crow>.ceil{grid-area:ceil}.crow>.rel{grid-area:rel}.crow>.trg{grid-area:trg}.crow>.ol{grid-area:ol}
  .crow>.cf{display:none}
  .crow>.unkc::before{content:'Unknown: '}.crow>.ceil::before{content:'Ceiling (calculated): ';font-weight:400}
  .stats{margin-left:0;width:100%}.stat{flex:1;min-width:0;padding:6px 10px}
  .stat b{font-size:19px}.stat span{font-size:11px;display:block;line-height:1.25}.top-row{padding:10px 0 8px;gap:8px}.brand p{display:none}
  .tools{gap:6px}.chk,.btn{padding:6px 9px;font-size:13px}.search{flex-basis:100%;max-width:none}
  dl.kv{grid-template-columns:1fr;gap:0}dl.kv dt{margin-top:8px}
  .evrow dl{grid-template-columns:1fr;gap:0}.evrow dt{margin-top:6px}
  dialog,dialog#drawer{max-width:100%}
  .brand h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
 <div class="wrap">
  <div class="top-row">
   <div class="brand"><h1>Path Prospect Map</h1><p>US plants that could use autonomous welding. Every value traces to a quoted source.</p></div>
   <div class="stats" id="stats" aria-label="Run totals"></div>
  </div>
  <div class="tools">
   <div class="search"><label class="sr" for="q">Search plants by name</label><input id="q" type="search" placeholder="Search plant, company or city" autocomplete="off"></div>
   <label class="chk" title="Hide every value tagged inferred. Values with no evidence row are never shown."><input type="checkbox" id="stated"> Stated facts only</label>
   <button class="btn" id="csv" type="button">Download CSV</button>
   <button class="btn" id="theme" type="button" aria-label="Switch colour theme">Theme: auto</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
 </div>
</header>
<main id="main" class="wrap" tabindex="-1">
 <section id="v-ranking" hidden></section>
 <section id="v-map" hidden></section>
 <section id="v-supply" hidden></section>
 <section id="v-calls" hidden></section>
 <section id="v-excluded" hidden></section>
 <section id="v-method" hidden></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<dialog id="profile" aria-labelledby="profile-t"></dialog>
<dialog id="drawer" aria-labelledby="drawer-t"></dialog>

<script id="data" type="application/json">__DATA__</script>
<script id="geo" type="application/json">__GEO__</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const GEO = JSON.parse(document.getElementById('geo').textContent);
const EV = D.ev, M = D.meta, C = M.counts;
const P = D.plants, V = D.verticals, LK = D.links;
/* Ground rule 1: a value with no evidence row is omitted (shown as "not sourced").
   Exempt: identity and location (name, city, state, lat/lon used only to place dots), the record's status and vertical,
   and calculated fields (score total, tier, confidence), which are sums of the six component rows. */
const PEX = new Set(['id','name','city','state','status','verticals','lat','lon','score_total','score_tier','confidence']);
const VEX = new Set(['id','name','status','rank']);
const UNSRC = {plants: 0, verticals: 0};
P.forEach(p => { Object.keys(p).forEach(f => { if (!PEX.has(f) && p[f] !== '' && !EV[p.id + ':' + f]) { p[f] = ''; UNSRC.plants++; } }); });
V.forEach(v => { Object.keys(v).forEach(f => { if (!VEX.has(f) && v[f] !== '' && !EV[v.id + ':' + f]) { v[f] = ''; UNSRC.verticals++; } }); });
const byId = {}; P.forEach(p => byId[p.id] = p);
const vById = {}; V.forEach(v => vById[v.id] = v);
const INCL = P.filter(p => p.status !== 'excluded');
const EXCL = P.filter(p => p.status === 'excluded');
const COMP = [
  ['score_process','Process fit',20],['score_material_part','Material and part fit',20],['score_part_mix','Part mix',15],
  ['score_labor','Labor pain',20],['score_demand','Demand and triggers',15],['score_scale','Scale',10]];
const TIERS = ['OEM','Tier 1','Tier 2','Contract fabricator','Tier 3'];
const TCLS = {'OEM':'oem','Tier 1':'t1','Tier 2':'t2','Contract fabricator':'cf','Tier 3':'t3'};
const SCORECARD = [['est_us_plants','Est. US plants'],['weld_intensity','Weld intensity'],['part_size_fit','Part-size fit'],['part_variety','Part variety'],['hiring_pain','Hiring pain'],['demand_outlook','Demand outlook'],['path_presence','Path presence'],['fit_test','Fit test']];
const VIEWS = [['ranking','Vertical ranking'],['map','Plant map'],['supply','Supply chain'],['calls','Call list'],['excluded','Excluded ('+EXCL.length+')'],['method','Method']];

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s == null ? '' : s).trim().toLowerCase();
const $ = (s, r) => (r || document).querySelector(s);
const sTier = p => p.status === 'profiled' && p.score_tier ? p.score_tier : '';
const tcls = t => t ? t.toLowerCase() : 'np';
const vNames = p => (p.verticals||'').split(/\s*[;,|]\s*/).filter(Boolean);
const vName = id => vById[id] ? vById[id].name : id;
const stateName = ab => { for (const k in M.state_abbr) if (M.state_abbr[k] === ab) return k; return ab; };

/* ---------- state ---------- */
const S = {view:'ranking', q:'', stated:false, f:{vert:'',tier:'',rel:'',state:'',stier:''}, sort:'score', liveOnly:false, lowCeil:false, pre:false, maker:'', colorBy:'score'};
try { const t = localStorage.getItem('ppm-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}

/* ---------- evidence helpers ---------- */
function effRow(claim, shown){
  const rows = EV[claim]; if (!rows) return null;
  const n = norm(shown); let m = null;
  rows.forEach(r => { if (norm(r.v) === n) m = r; });
  return m || rows[rows.length-1];
}
function verState(row){
  if (row.vf && row.vf !== 'not_checked') return row.vf;
  return row.fc ? row.fc.status : (row.vf || 'not_checked');
}
const isComposed = r => !!(r && r.t === 'inferred' && /^composed from stated claims/i.test(r.r || ''));
function badgeTag(t, row){
  if (t === 'inferred' && isComposed(row)) return '<span class="badge b-inf" title="Inferred: composed from stated claims, a guess to verify">inferred &middot; composed</span>';
  if (t === 'inferred') return '<span class="badge b-inf" title="Inferred: a guess to verify">inferred</span>';
  if (t === 'unknown') return '<span class="badge b-unknown">unknown</span>';
  return '';
}
/* a clickable value. obj = record, field = column, prefix = claim id prefix */
function val(obj, field, prefix, opt){
  opt = opt || {};
  const raw = obj[field];
  const claim = prefix + ':' + field;
  const row = effRow(claim, raw);
  const text = raw == null || raw === '' ? '' : raw;
  if (text === '' && !row) return '<span class="muted">not sourced</span>';
  if (row && row.t === 'inferred' && S.stated) return '<span class="hid">inferred value hidden</span>';
  let shown = esc(opt.max && text.length > opt.max ? text.slice(0, opt.max).trimEnd() + '…' : text);
  if (text === '') shown = '<span class="muted">not sourced</span>';
  const unk = row.t === 'unknown' || /^unknown\b/i.test(text);
  const vs = verState(row);
  const mark = vs === 'corrected' ? ' <span class="badge b-warn" title="A fact-check corrected this claim">corrected</span>' : vs === 'unreachable' ? ' <span class="badge b-bad">source unreachable</span>' : '';
  return '<button type="button" class="val' + (unk ? ' unk' : '') + '" data-claim="' + esc(claim) + '" data-shown="' + esc(text) + '" aria-label="' + esc((opt.label || field.replace(/_/g,' ')) + ': ' + (text || 'not sourced') + '. Open evidence') + '">' + shown + '</button> ' + badgeTag(row.t, row) + mark;
}
function tierBadge(t){ return t ? '<span class="badge b-st">' + esc(t) + '</span>' : ''; }
function scoreBadge(p){
  const t = sTier(p);
  return t ? '<span class="badge b-' + t.toLowerCase() + '">' + t + '</span>' : '<span class="badge b-np">not yet profiled</span>';
}

/* ---------- filtering ---------- */
function matchQ(p){
  if (!S.q) return true;
  const q = norm(S.q);
  return norm(p.name).includes(q) || norm(p.parent_company).includes(q) || norm(p.city).includes(q) || norm(p.state) === q;
}
function passes(p, ignoreScoreTier){
  const f = S.f;
  if (!matchQ(p)) return false;
  if (f.vert && !vNames(p).includes(f.vert)) return false;
  if (f.tier && (p.tier||'unknown') !== f.tier) return false;
  if (f.rel && (p.relationship||'unknown') !== f.rel) return false;
  if (f.state && p.state !== f.state) return false;
  if (S.pre && !isPre(p)) return false;
  if (!ignoreScoreTier && f.stier){
    const t = sTier(p) || 'Not profiled';
    if (t !== f.stier) return false;
  }
  return true;
}
const DV = D.derived || {}, DS = D.dstats || {};
const UNK_LBL = {process:'Process fit', material_part:'Material and part fit', part_mix:'Part mix', labor:'Labor pain', scale:'Scale'};
const unkOf = p => (DV[p.id] && DV[p.id].unk) || [];
const ceilOf = p => DV[p.id] && DV[p.id].ceil != null ? DV[p.id].ceil : null;
const isPre = p => !!(DV[p.id] && DV[p.id].pre);
const preBadge = p => isPre(p) ? '<span class="badge b-pre" title="Under construction or ramping up: no process or robots locked in yet">Pre-production</span>' : '';
const scoreOf = p => p.score_total === '' || p.score_total == null ? -1 : +p.score_total;
const cmpScore = (a,b) => scoreOf(b) - scoreOf(a) || (+b.confidence||0) - (+a.confidence||0) || a.name.localeCompare(b.name);

/* ---------- header, nav, footer ---------- */
function renderChrome(){
  $('#stats').innerHTML =
    '<div class="stat"><b>' + C.verticals_done + '<small class="muted" style="font-size:13px;font-weight:600"> / ' + C.verticals_total + '</small></b><span>Verticals done' + (C.verticals_partial || C.verticals_accepted ? ' (' + [C.verticals_partial ? C.verticals_partial + ' partial' : '', C.verticals_accepted ? C.verticals_accepted + ' accepted, not started' : ''].filter(Boolean).join(', ') + ')' : '') + '</span></div>' +
    '<div class="stat"><b>' + C.plants_found + '</b><span>Plants found (' + C.plants_included + ' included, ' + C.plants_excluded + ' excluded)</span></div>' +
    '<div class="stat"><b>' + C.plants_profiled + '</b><span>Plants profiled</span></div>';
  $('#tabs').innerHTML = VIEWS.map(v => '<button type="button" data-view="' + v[0] + '">' + esc(v[1]) + '</button>').join('');
  const d = M.dates;
  const range = d.length > 1 ? d[0] + ' to ' + d[d.length-1] : (d[0] || 'unknown');
  $('#foot').innerHTML = '<p><strong>Inferred fields are guesses to verify.</strong> Values tagged inferred carry an &ldquo;inferred&rdquo; label; click any value for its quote, source and verified status.</p>' +
    '<p>Run dates: ' + esc(d.length > 1 && d.length < 6 ? d.join(', ') : range) + (M.commit ? ' &middot; built from ledger commit ' + esc(M.commit) : '') + ' &middot; ' + C.evidence_rows + ' evidence rows &middot; Path Prospect Map, an outside pitch to Path sales. Business-level facts only.</p>';
}
function setActiveTab(){
  document.querySelectorAll('#tabs button').forEach(b => { if (b.dataset.view === S.view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
}

/* ---------- filter bar ---------- */
function opts(list, cur, all){ return '<option value="">' + all + '</option>' + list.map(o => '<option value="' + esc(o[0]) + '"' + (o[0] === cur ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join(''); }
function filterBar(id, withScoreTier){
  const states = [...new Set(P.map(p => p.state).filter(Boolean))].sort();
  const rels = [...new Set(P.map(p => p.relationship || 'unknown'))].sort();
  const tiers = [...new Set([...TIERS, ...P.map(p => p.tier || 'unknown')])];
  const f = S.f;
  return '<div class="filters" id="' + id + '">' +
   '<label>Vertical<select data-f="vert">' + opts(V.filter(v => P.some(p => vNames(p).includes(v.id))).map(v => [v.id, v.name]), f.vert, 'All verticals') + '</select></label>' +
   '<label>Supply-chain tier<select data-f="tier">' + opts(tiers.map(t => [t,t]), f.tier, 'All tiers') + '</select></label>' +
   '<label>Relationship<select data-f="rel">' + opts(rels.map(t => [t,t.replace(/_/g,' ')]), f.rel, 'All relationships') + '</select></label>' +
   '<label>State<select data-f="state">' + opts(states.map(t => [t, stateName(t)]), f.state, 'All states') + '</select></label>' +
   (withScoreTier ? '<label>Score tier<select data-f="stier">' + opts(['High','Medium','Low','Not profiled'].map(t => [t,t]), f.stier, 'All score tiers') + '</select></label>' : '<span></span>') +
   '<label>&nbsp;<button type="button" class="btn" data-reset>Reset filters</button></label>' +
   '<div class="count"><label class="chk" style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" data-pre> Pre-production only <span class="muted small">(under construction or ramping up: ' + (DS.preprod || 0) + ' plants)</span></label></div>' +
   '<div class="count" data-count></div></div>';
}
function syncFilters(root){ const pc = root.querySelector('input[data-pre]'); if (pc) pc.checked = S.pre; root.querySelectorAll('select[data-f]').forEach(s => { s.value = S.f[s.dataset.f]; }); }
function bindFilters(root, rerender){
  root.querySelectorAll('select[data-f]').forEach(s => s.addEventListener('change', () => { S.f[s.dataset.f] = s.value; rerender(); }));
  const pc = root.querySelector('input[data-pre]');
  if (pc) pc.addEventListener('change', () => { S.pre = pc.checked; rerender(); });
  const r = root.querySelector('[data-reset]');
  if (r) r.addEventListener('click', () => { S.f = {vert:'',tier:'',rel:'',state:'',stier:''}; S.q=''; S.pre=false; S.lowCeil=false; S.liveOnly=false; $('#q').value=''; refresh(); });
}

/* ---------- ranking ---------- */
function vCounts(v){
  const ps = P.filter(p => vNames(p).includes(v.id));
  const inc = ps.filter(p => p.status !== 'excluded');
  const c = {total: ps.length, included: inc.length, profiled: inc.filter(p => p.status === 'profiled').length, excluded: ps.length - inc.length, High:0, Medium:0, Low:0};
  inc.forEach(p => { const t = sTier(p); if (t) c[t]++; });
  c.np = c.included - c.High - c.Medium - c.Low;
  return c;
}
function renderRanking(){
  const el = $('#v-ranking');
  const vs = V.slice().sort((a,b) => (+a.rank||99) - (+b.rank||99));
  el.innerHTML = '<div class="view-h"><h2>Vertical ranking</h2><p>' + V.length + ' verticals from the ledger, ranked by the planner scorecard. Plant counts and High / Medium / Low splits come from plants.csv; only verticals that have been researched have plants.</p></div><div class="vcards">' +
  vs.map(v => {
    const c = vCounts(v);
    const bar = c.included ? '<div class="bar" role="img" aria-label="' + c.High + ' High, ' + c.Medium + ' Medium, ' + c.Low + ' Low, ' + c.np + ' not yet profiled">' +
      ['High','Medium','Low','np'].map(k => { const n = k === 'np' ? c.np : c[k]; return n ? '<i class="s-' + k.toLowerCase() + '" style="width:' + (n / c.included * 100) + '%"></i>' : ''; }).join('') + '</div>' : '<span class="muted small">No plants researched yet</span>';
    const sg = SCORECARD.map(f => '<div><div class="k">' + f[1] + '</div><div class="v">' + val(v, f[0], v.id, {label: f[1], max: 260}) + '</div></div>').join('');
    return '<article class="card vcard' + (v.status === 'rejected' ? ' rej' : '') + '" id="vc-' + esc(v.id) + '">' +
      '<div class="vhead"><span class="vrank" aria-label="Rank ' + esc(v.rank) + '">' + esc(v.rank) + '</span><h3>' + esc(v.name) + '</h3>' +
      '<span class="badge ' + ({done:'b-ok',accepted:'b-st',partial:'b-warn',rejected:'b-bad',candidate:'b-grey'}[v.status] || 'b-grey') + '">' + esc(v.status) + '</span></div>' +
      '<div class="vmeta"><div class="vnum"><b>' + c.included + '</b><span>included plants</span></div><div class="vnum"><b>' + c.profiled + '</b><span>profiled</span></div>' +
      '<div class="vnum"><b style="color:var(--high)">' + c.High + '</b><span>High</span></div><div class="vnum"><b style="color:var(--med)">' + c.Medium + '</b><span>Medium</span></div><div class="vnum"><b style="color:var(--low)">' + c.Low + '</b><span>Low</span></div>' +
      (c.excluded ? '<div class="vnum"><b>' + c.excluded + '</b><span>excluded</span></div>' : '') + bar +
      (c.included ? '<button type="button" class="btn small" data-showv="' + esc(v.id) + '">Show on map</button>' : '') + '</div>' +
      '<div class="score-grid">' + sg + '</div>' +
      (v.status === 'partial' ? '<p class="reason partial"><span class="badge b-warn">partial</span> Research or checks on this vertical are incomplete. See the Method page for what was and was not finished.</p>' : '') +
      '<p class="reason"><strong>Why this status:</strong> ' + val(v, 'reason', v.id, {label: 'reason'}) + '</p>' +
      '<details class="more"><summary>Definition</summary><p>' + val(v, 'definition', v.id) + '</p></details></article>';
  }).join('') + '</div>';
  el.querySelectorAll('[data-showv]').forEach(b => b.addEventListener('click', () => { S.f.vert = b.dataset.showv; go('map'); }));
}

/* ---------- map component ---------- */
const W = 975, H = 610;
const proj = d3.geoAlbersUsa().scale(1280).translate([W/2, H/2]);
const gpath = d3.geoPath(proj);
function makeMap(host){
  const svg = d3.select(host).append('svg').attr('viewBox', '0 0 ' + W + ' ' + H).attr('role', 'group').attr('aria-label', 'Map of the United States with plant dots');
  const g = svg.append('g');
  const gs = g.append('g');
  const gl = g.append('g');
  const gd = g.append('g');
  const counts = {};
  INCL.forEach(p => counts[p.state] = (counts[p.state]||0) + 1);
  const paths = gs.selectAll('path').data(GEO.features).join('path').attr('class', f => 'st' + (counts[f.properties.abbr] ? ' has' : '')).attr('d', gpath);
  paths.append('title').text(f => f.properties.name + (counts[f.properties.abbr] ? ': ' + counts[f.properties.abbr] + ' included plants' : ''));
  let k = 1;
  const zoom = d3.zoom().scaleExtent([1, 14]).translateExtent([[0,0],[W,H]]).filter(e => e.type === 'wheel' ? (e.ctrlKey || e.metaKey) : e.type.startsWith('touch') ? (e.touches && e.touches.length > 1) : !e.button)
    .on('zoom', e => { k = e.transform.k; g.attr('transform', e.transform); scaleDots(); });
  svg.call(zoom).on('dblclick.zoom', null);
  function scaleDots(){ gd.selectAll('circle.pt').attr('r', d => d.r / Math.sqrt(k)); }
  const ctl = d3.select(host).append('div').attr('class', 'mapctl');
  [['+', 'Zoom in', () => svg.transition().duration(200).call(zoom.scaleBy, 1.7)], ['−', 'Zoom out', () => svg.transition().duration(200).call(zoom.scaleBy, 1/1.7)], ['⌂', 'Reset zoom', () => svg.transition().duration(200).call(zoom.transform, d3.zoomIdentity)]]
    .forEach(b => ctl.append('button').attr('type','button').attr('aria-label', b[1]).attr('title', b[1] + ' (Ctrl or Cmd + scroll also zooms)').text(b[0]).on('click', b[2]));
  function place(dots){
    const grp = {};
    dots.forEach(d => { const p = proj([+d.p.lon, +d.p.lat]); d.xy = p; if (p) { const key = Math.round(p[0]) + ',' + Math.round(p[1]); (grp[key] = grp[key] || []).push(d); } });
    Object.values(grp).forEach(a => { if (a.length > 1) a.forEach((d,i) => { const ang = i / a.length * 2*Math.PI - Math.PI/2, rad = 4 + a.length * .7; d.xy = [d.xy[0] + Math.cos(ang)*rad, d.xy[1] + Math.sin(ang)*rad]; }); });
    return dots.filter(d => d.xy);
  }
  return {
    svg, paths, g,
    onState(fn){ paths.on('click', (e,f) => fn(f.properties.abbr)); },
    update(dots, o){
      o = o || {};
      dots = place(dots);
      paths.classed('sel', f => !!o.selState && f.properties.abbr === o.selState);
      const sel = gd.selectAll('circle.pt').data(dots, d => d.p.id);
      sel.exit().remove();
      const en = sel.enter().append('circle').attr('tabindex', 0).attr('role', 'button');
      en.append('title');
      const all = en.merge(sel);
      all.attr('class', d => 'pt ' + d.cls).attr('cx', d => d.xy[0]).attr('cy', d => d.xy[1]).attr('r', d => d.r / Math.sqrt(k))
        .attr('aria-label', d => d.p.name + ', ' + d.p.city + ' ' + d.p.state + ', ' + d.label + '. Open profile')
        .on('click', (e,d) => openPlant(d.p.id, e.currentTarget))
        .on('keydown', (e,d) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openPlant(d.p.id, e.currentTarget); } });
      all.select('title').text(d => d.p.name + ' (' + d.p.city + ', ' + d.p.state + ') - ' + d.label);
      // draw order: dim first, highlighted last
      all.sort((a,b) => (a.z||0) - (b.z||0));
      const lines = (o.lines || []).map(l => { const a = proj([+l[0].lon, +l[0].lat]), b = proj([+l[1].lon, +l[1].lat]); return a && b ? 'M' + a + 'L' + b : null; }).filter(Boolean);
      gl.selectAll('path').data(lines).join('path').attr('class','lk').attr('d', d => d);
    }
  };
}
const dotCls = (p, by) => by === 'tier' ? 'c-' + (TCLS[p.tier] || 'unk') : 'c-' + tcls(sTier(p));
const dotLabel = p => (sTier(p) ? sTier(p) + ' ' + p.score_total : 'not yet profiled') + (isPre(p) ? ', pre-production' : '');
let mapA = null, mapB = null;

function legend(by){
  if (by === 'tier') return TIERS.map(t => '<span class="i"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" style="fill:var(--t-' + TCLS[t].replace('t1','t1') + ')"/></svg>' + t + '</span>').join('');
  return '<span class="i"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="var(--high)"/></svg>High 70+</span><span class="i"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="var(--med)"/></svg>Medium 45-69</span><span class="i"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="var(--low)"/></svg>Low under 45</span><span class="i"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--np)" stroke-width="2"/></svg>Not yet profiled</span>';
}
function plantRow(p, extra){
  const t = sTier(p);
  return '<div class="prow"><span class="dot-i d-' + (t ? t.toLowerCase() : 'np') + '" aria-hidden="true"></span><div class="nm"><button type="button" class="link" data-plant="' + esc(p.id) + '">' + esc(p.name) + '</button>' +
    '<div class="sub">' + esc(p.city) + ', ' + esc(p.state) + (p.tier ? ' &middot; ' + esc(p.tier) : '') + (p.relationship ? ' &middot; ' + esc(p.relationship.replace(/_/g,' ')) : '') + (extra ? ' &middot; ' + extra : '') + '</div>' + (isPre(p) ? '<div>' + preBadge(p) + '</div>' : '') + '</div>' +
    '<span class="sc">' + (t ? esc(p.score_total) : '') + '</span>' + (t || p.status === 'excluded' ? '' : '<span class="badge b-np">not yet profiled</span>') + '</div>';
}
function renderMap(){
  const el = $('#v-map');
  if (!el.dataset.init){
    el.innerHTML = '<div class="view-h"><h2>Plant map</h2><p>Every included plant is a dot. Click a state to list its plants, a dot to open the plant profile. Use Ctrl or Cmd with the scroll wheel, or the buttons, to zoom.</p></div>' + filterBar('fbar-map', true) +

/* ---------- supply chain ---------- */
function companyName(id){
  const m = id.replace(/^c-/, '').split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  return m;
}
function endpoint(id){
  if (byId[id]) return {id, plant: byId[id], name: byId[id].name, tier: byId[id].tier || 'unknown'};
  return {id, plant: null, name: companyName(id) + ' (company level)', tier: 'Company level, no plant row'};
}
const makerKey = p => { const raw = /^unknown/i.test(p.parent_company || 'unknown') ? p.name : p.parent_company; return raw; };
const makerNorm = raw => raw.toLowerCase().replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9 ]+/g, ' ').replace(/\b(inc|llc|corp|corporation|co|company|industries|ltd|holdings|group)\b/g, ' ').replace(/\s+/g, ' ').trim();
function makerList(){
  const groups = {};
  P.forEach(p => { const raw = makerKey(p), n = makerNorm(raw) || raw; const g = groups[n] = groups[n] || {names: {}, ps: []}; g.names[raw] = (g.names[raw]||0) + 1; g.ps.push(p); });
  const m = {};
  Object.values(groups).forEach(g => { const label = Object.entries(g.names).sort((a,b) => b[1]-a[1] || a[0].length - b[0].length)[0][0]; m[label] = g.ps; });
  return Object.entries(m).filter(([k, ps]) => ps.some(p => p.status !== 'excluded') || ps.some(p => LK.some(l => l.from_id === p.id || l.to_id === p.id))).sort((a,b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
}
function renderSupply(){
  const el = $('#v-supply');
  const makers = makerList();
  if (!S.maker || !makers.some(m => m[0] === S.maker)) { const nl = m => LK.filter(l => m[1].some(p => p.id === l.from_id || p.id === l.to_id)).length; S.maker = (makers.slice().sort((a,b) => nl(b) - nl(a))[0] || [''])[0]; }
  if (!el.dataset.init){
    el.innerHTML = '<div class="view-h"><h2>Supply chain</h2><p>Choose a maker. Its plants are highlighted on the map and listed by tier; suppliers and customers linked in links.csv are outlined in orange, with the evidence for each link.</p></div>' +
      '<div class="sc-top"><label>Maker (parent company)<select id="makerSel"></select></label></div>' +
      '<div class="mapgrid"><div><div class="card"><div class="mapbox" id="mapB"></div><div class="legend" id="legendB"></div></div></div><div class="card list" id="sclist" aria-live="polite"></div></div>';
    mapB = makeMap($('#mapB'));
    $('#makerSel').addEventListener('change', e => { S.maker = e.target.value; renderSupply(); });
    el.dataset.init = 1;
  }
  const sel = $('#makerSel');
  sel.innerHTML = makers.map(([k, ps]) => { const nl = LK.filter(l => ps.some(p => p.id === l.from_id || p.id === l.to_id)).length; return '<option value="' + esc(k) + '"' + (k === S.maker ? ' selected' : '') + '>' + esc(k) + ' (' + ps.length + ' plant' + (ps.length === 1 ? '' : 's') + (nl ? ', ' + nl + ' link' + (nl === 1 ? '' : 's') : '') + ')</option>'; }).join('');
  const mp = (makers.find(m => m[0] === S.maker) || ['', []])[1];
  const mpIds = new Set(mp.map(p => p.id));
  const links = LK.filter(l => mpIds.has(l.from_id) || mpIds.has(l.to_id));
  const supIds = new Set();
  links.forEach(l => { [l.from_id, l.to_id].forEach(i => { if (!mpIds.has(i) && byId[i]) supIds.add(i); }); });
  const lines = [];

  const dots = [];
  INCL.forEach(p => { if (!mpIds.has(p.id) && !supIds.has(p.id)) dots.push({p, cls: 'c-np dim', r: 4, label: 'other included plant', z: 0}); });
  P.forEach(p => {
    if (supIds.has(p.id)) dots.push({p, cls: (p.status === 'excluded' ? 'excl' : dotCls(p, 'score')) + ' sup', r: 7, label: 'linked plant' + (p.status === 'excluded' ? ' (excluded)' : ''), z: 4});
    else if (mpIds.has(p.id)) dots.push({p, cls: p.status === 'excluded' ? 'excl' : dotCls(p, 'score'), r: 7.5, label: dotLabel(p) + (p.status === 'excluded' ? ' (excluded)' : ''), z: 5});
  });
  mapB.update(dots, {lines});
  $('#legendB').innerHTML = '<span class="i"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="var(--high)"/></svg>Maker plant (colour = score tier)</span><span class="i"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="var(--low)" stroke="var(--sup)" stroke-width="2.5"/></svg>Linked plant</span><span class="i"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--np)" stroke-dasharray="3 2" stroke-width="2"/></svg>Excluded plant</span><span class="i"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="4" fill="var(--np)" opacity=".4"/></svg>Other included plant</span>';
  // list by tier
  const byTier = {};
  mp.slice().sort(cmpScore).forEach(p => { const t = p.tier || 'unknown'; (byTier[t] = byTier[t] || []).push(p); });

    const mineEnd = endpoint(toMaker ? l.to_id : l.from_id);
    (lt[other.tier] = lt[other.tier] || []).push({l, other, mineEnd, toMaker});
  });
  Object.keys(lt).sort((a,b) => (order.indexOf(a) < 0 ? 99 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 99 : order.indexOf(b))).forEach(t => {
    h += '<div class="tiergrp"><h4>' + esc(t) + '</h4>' + lt[t].map(x => {
      const row = effRow(x.l.claim_id, x.l.what_is_supplied);
      const nm = e => e.plant ? '<button type="button" class="link" data-plant="' + esc(e.id) + '">' + esc(e.name) + '</button>' : esc(e.name);
      return '<div class="lcard">' + nm(x.other) + ' <span class="arrow">' + (x.toMaker ? '&rarr; supplies' : '&larr; is supplied by') + '</span> ' + nm(x.mineEnd) +
        '<div class="small">' + (S.stated && row && row.t === 'inferred' ? '<span class="hid">inferred link detail hidden</span>' : row ? esc(x.l.what_is_supplied) : '') + ' ' + (row ? badgeTag(row.t, row) : '<span class="muted">not sourced</span>') + '</div>' +
        (row && !(S.stated && row.t === 'inferred') ? '<div style="margin-top:4px"><button type="button" class="btn small" data-claim="' + esc(x.l.claim_id) + '" data-shown="' + esc(x.l.what_is_supplied) + '">Evidence for this link</button> <span class="badge b-' + ({confirmed:'ok',corrected:'warn',unreachable:'bad'}[verState(row)] || 'grey') + '">' + esc(String(verState(row)).replace('_',' ')) + '</span></div>' : '') + '</div>';
    }).join('') + '</div>';
  });
  $('#sclist').innerHTML = h;
}

/* ---------- call list ---------- */
function callRows(){
  let rows = P.filter(p => p.status === 'profiled' && passes(p));
  if (S.liveOnly) rows = rows.filter(p => +p.score_demand === 15);
  if (S.lowCeil) rows = rows.filter(p => +p.score_total < 45 && (ceilOf(p) || 0) >= 70);
  const s = S.sort;
  rows.sort(s === 'name' ? (a,b) => a.name.localeCompare(b.name) : s === 'state' ? (a,b) => a.state.localeCompare(b.state) || cmpScore(a,b) : s === 'confidence' ? (a,b) => (+b.confidence) - (+a.confidence) || cmpScore(a,b) : cmpScore);
  return rows;
}

function kindsHtml(k){ const e = Object.entries(k || {}).sort((a,b) => b[1]-a[1]); return e.length ? e.map(x => esc(x[0]) + ' ' + x[1]).join(', ') : '<span class="muted">none recorded</span>'; }

  '<p class="small muted">The rubric above is the brief. These are the interpretations the coordinator logged while scoring, quoted from the run log. Where they say &ldquo;stated&rdquo;, a source must say it; nothing is inferred from industry.</p>' + ul(B.rules) +
  '<p><strong>Data gap, not a poor fit:</strong> ' + mat0 + ' of ' + C.plants_profiled + ' profiled plants score 0 on material and part fit because no source states the size or weight of the parts welded at that plant. Pole makers rarely publish section dimensions. Their real fit is unknown, and a score of 0 here reflects missing data.</p>' +

    const inf = [];
    const vals = cols.map(c => { const r = effRow(p.id + ':' + c, p[c]); if (r && r.t === 'inferred'){ inf.push(c); if (S.stated) return ''; } return p[c]; });
    const extra = p.status === 'profiled' ? [unkOf(p).length + ' of 6', ceilOf(p) == null ? '' : ceilOf(p), isPre(p) ? 'yes' : ''] : ['', '', isPre(p) ? 'yes' : ''];
    out.push(vals.concat(extra, [inf.join(' ')]).map(csvCell).join(','));
  });
  return out.join('\r\n');
}
function currentCsv(){
  const v = S.view;
  if (v === 'ranking'){
    const cols = ['rank','id','name','status','included_plants','profiled','high','medium','low','excluded'].concat(SCORECARD.map(f => f[0]));
    return ['path-prospect-verticals', [cols.join(',')].concat(V.map(x => { const c = vCounts(x); return [x.rank, x.id, x.name, x.status, c.included, c.profiled, c.High, c.Medium, c.Low, c.excluded].concat(SCORECARD.map(f => { const r = effRow(x.id + ':' + f[0], x[f[0]]); return S.stated && r && r.t === 'inferred' ? '' : x[f[0]]; })).map(csvCell).join(','); })).join('\r\n')];
  }
  if (v === 'calls') return ['path-prospect-call-list', plantCsv(callRows())];
  if (v === 'excluded') return ['path-prospect-excluded', plantCsv(EXCL.filter(p => passes(p, true)))];
  if (v === 'supply'){
    const mp = (makerList().find(m => m[0] === S.maker) || ['', []])[1];
    return ['path-prospect-supply-' + S.maker.toLowerCase().replace(/[^a-z0-9]+/g,'-'), plantCsv(mp)];
  }
  if (v === 'method') return ['path-prospect-plants-all', plantCsv(P)];
  return ['path-prospect-plant-map', plantCsv(INCL.filter(p => passes(p)))];
}
function download(){
  const [name, text] = currentCsv();
  const blob = new Blob(['﻿' + text], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '-' + (M.last || 'ledger') + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- routing / refresh ---------- */
const RENDER = {ranking: renderRanking, map: renderMap, supply: renderSupply, calls: renderCalls, excluded: renderExcluded, method: renderMethod};
const dirty = new Set(Object.keys(RENDER));
function refresh(){ Object.keys(RENDER).forEach(k => dirty.add(k)); renderActive(); }
function renderActive(){
  VIEWS.forEach(v => { $('#v-' + v[0]).hidden = v[0] !== S.view; });
  setActiveTab();
  if (dirty.has(S.view)){ dirty.delete(S.view); RENDER[S.view](); }
  $('#csv').title = 'Download the current ' + (VIEWS.find(v => v[0] === S.view)[1].toLowerCase()) + ' as CSV';
}
function go(view, focus){
  S.view = view;
  dirty.add(view);
  try { history.replaceState(null, '', '#' + view); } catch(e){}
  renderActive();
  if (focus){ const h = $('#v-' + view + ' h2'); if (h){ h.tabIndex = -1; h.focus(); } }
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-claim]'); if (!t) return;
  if (t.dataset.view){ go(t.dataset.view, true); return; }
  if (t.dataset.claim){ openEvidence(t.dataset.claim, t.dataset.shown, t); return; }
  if (t.dataset.plant){ openPlant(t.dataset.plant, t); return; }
  if (t.dataset.close){ closeDlg($('#' + t.dataset.close)); return; }
  if (t.hasAttribute('data-back')){ dstack.pop(); const [c, s] = dstack[dstack.length-1]; $('#drawer').innerHTML = drawerHtml(c, s); $('#drawer').scrollTop = 0; const f = $('#drawer [data-close]'); if (f) f.focus(); return; }
});
['profile','drawer'].forEach(id => {
  const d = $('#' + id);
  d.addEventListener('close', () => {
    if (id === 'drawer') dstack.length = 0;
    if (id === 'profile'){ try { history.replaceState(null, '', '#' + S.view); } catch(e){} }
    const o = d._opener; d._opener = null;
    if (o && document.contains(o)) o.focus();
  });
  d.addEventListener('click', e => { if (e.target === d) d.close(); });  // click on backdrop
});
$('#q').addEventListener('input', e => { S.q = e.target.value; refresh(); });
$('#stated').addEventListener('change', e => {
  S.stated = e.target.checked; refresh();
  const pd = $('#profile'); if (pd.open && pd.dataset.pid) pd.innerHTML = profileHtml(byId[pd.dataset.pid]);
  const dd = $('#drawer'); if (dd.open && dstack.length){ const [c, s] = dstack[dstack.length-1]; dd.innerHTML = drawerHtml(c, s); }
});
$('#csv').addEventListener('click', download);
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || '';
  const nxt = cur === '' ? 'light' : cur === 'light' ? 'dark' : '';
  if (nxt) document.documentElement.dataset.theme = nxt; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('ppm-theme', nxt); } catch(e){}
  $('#theme').textContent = 'Theme: ' + (nxt || 'auto');
});
$('#theme').textContent = 'Theme: ' + (document.documentElement.dataset.theme || 'auto');

renderChrome();
(function init(){
  const h = (location.hash || '').replace(/^#/, '').split('/');
  if (RENDER[h[0]]) S.view = h[0];
  renderActive();
  if (h[1] && byId[h[1]]) openPlant(h[1]);
})();
window.addEventListener('hashchange', () => { const h = location.hash.replace(/^#/, '').split('/'); if (RENDER[h[0]] && h[0] !== S.view) go(h[0]); });
})();
</script>
